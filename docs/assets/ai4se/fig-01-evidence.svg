<line x1="828.6" y1="96" x2="828.6" y2="476" stroke="#d8dee4" stroke-width="1"/>
<text x="828.6" y="500" font-size="12" fill="#57606a" text-anchor="middle">+5%</text>
<line x1="914.3" y1="96" x2="914.3" y2="476" stroke="#d8dee4" stroke-width="1"/>
<text x="914.3" y="500" font-size="12" fill="#57606a" text-anchor="middle">+15%</text>
<line x1="1000.0" y1="96" x2="1000.0" y2="476" stroke="#d8dee4" stroke-width="1"/>
<text x="1000.0" y="500" font-size="12" fill="#57606a" text-anchor="middle">+25%</text>
<line x1="785.7" y1="92" x2="785.7" y2="480" stroke="#1f2328" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.65"/>
<text x="380" y="124.7" font-size="13" fill="#1f2328" text-anchor="end">Peng 2023｜单任务 RCT（n=95）</text>
<text x="380" y="143.7" font-size="11.5" fill="#57606a" text-anchor="end">快 55.8%，折算约 -36%</text>
<line x1="785.7" y1="127.7" x2="478.9" y2="127.7" stroke="#1a7f37" stroke-width="2" opacity="0.35"/>
<circle cx="478.9" cy="127.7" r="6" fill="#1a7f37" opacity="1"/>
<text x="478.9" y="114.7" font-size="11.5" font-weight="600" fill="#1a7f37" text-anchor="middle">-35.8%</text>
<text x="380" y="188.0" font-size="13" fill="#1f2328" text-anchor="end">Google 2024｜单任务 RCT（n=96）</text>
<text x="380" y="207.0" font-size="11.5" fill="#57606a" text-anchor="end">约 -21%（p=0.086，不显著）</text>
<line x1="785.7" y1="191.0" x2="605.7" y2="191.0" stroke="#1a7f37" stroke-width="2" opacity="0.35"/>
