<text x="522.6" y="304.7" font-size="11.5" font-weight="600" fill="#1a7f37" text-anchor="middle">-30.7%</text>
<text x="380" y="378.0" font-size="13" fill="#1f2328" text-anchor="end">METR 2025｜真实任务（n=16）</text>
<text x="380" y="397.0" font-size="11.5" fill="#57606a" text-anchor="end">耗时 +19%（更慢）</text>
<line x1="785.7" y1="381.0" x2="948.6" y2="381.0" stroke="#cf222e" stroke-width="2" opacity="0.35"/>
<circle cx="948.6" cy="381.0" r="6" fill="#cf222e" opacity="1"/>
<text x="948.6" y="368.0" font-size="11.5" font-weight="600" fill="#cf222e" text-anchor="middle">+19.0%</text>
<text x="380" y="441.3" font-size="13" fill="#1f2328" text-anchor="end">METR 2026｜回归子集（n=10）</text>
<text x="380" y="460.3" font-size="11.5" fill="#57606a" text-anchor="end">耗时 -18%，作者称不可靠</text>
<line x1="785.7" y1="444.3" x2="631.4" y2="444.3" stroke="#8c959f" stroke-width="2" opacity="0.35"/>
<circle cx="631.4" cy="444.3" r="5" fill="#8c959f" opacity="0.6"/>
<text x="631.4" y="431.3" font-size="11.5" font-weight="600" fill="#8c959f" text-anchor="middle">-18.0%</text>
<text x="40" y="526" font-size="11" fill="#57606a">注：Peng/Cui 的耗时为按“提速幅度”“PR 数增幅”折算的近似值；METR 2026 因选择效应被作者判定为“很弱的证据”。数据来源见附录 C。</text>
<text x="785.7" y="500" font-size="12" fill="#57606a" text-anchor="middle">0</text>
</svg>