<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="540" viewBox="0 0 1060 540" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif">
<rect width="1060" height="540" fill="#ffffff"/>
<text x="40" y="38" font-size="21" font-weight="600" fill="#1f2328">同一问题，六个答案：受控研究测得的任务耗时变化</text>
<text x="40" y="62" font-size="12.5" fill="#57606a">← 更快　　相对无 AI 的任务耗时变化（%）　　更慢 →　　仅比较方向，不同研究口径不可直接合并</text>
<rect x="400" y="96" width="385.7" height="380" fill="#f6f8fa"/>
