<text x="380" y="270.3" font-size="11.5" fill="#57606a" text-anchor="end">PR/周 +26.1%，折算约 -21%</text>
<line x1="785.7" y1="254.3" x2="608.3" y2="254.3" stroke="#1a7f37" stroke-width="2" opacity="0.35"/>
